<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Adriano Ferreira experience matrix</title>
  <desc id="desc">Experience cards showing total experience, Java, cloud and platform, and embedded C++.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c3cff"/>
      <stop offset="1" stop-color="#ff2ea6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="310" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="307" rx="26.5" fill="none" stroke="#3f5f86" stroke-opacity=".5" stroke-width="3"/>
  <text x="46" y="54" fill="#dff7ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">EXPERIENCE MATRIX</text>
  <path d="M46 76 H1154" stroke="url(#accent)" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(46 105)">
      <rect width="252" height="150" rx="18" fill="#0b1a2d" stroke="#00e5ff" stroke-opacity=".45"/>
      <text x="126" y="70" text-anchor="middle" fill="#00e5ff" font-size="48" font-weight="800" filter="url(#glow)">23+</text>
      <text x="126" y="106" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="2">YEARS</text>
      <text x="126" y="130" text-anchor="middle" fill="#7fa7c8" font-size="14">Technology &amp; Leadership</text>
    </g>

    <g transform="translate(332 105)">
      <rect width="252" height="150" rx="18" fill="#0b1a2d" stroke="#7c3cff" stroke-opacity=".55"/>
      <text x="126" y="70" text-anchor="middle" fill="#a98cff" font-size="48" font-weight="800">20+</text>
      <text x="126" y="106" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="2">JAVA</text>
      <text x="126" y="130" text-anchor="middle" fill="#7fa7c8" font-size="14">Enterprise Engineering</text>
    </g>

    <g transform="translate(618 105)">
      <rect width="252" height="150" rx="18" fill="#0b1a2d" stroke="#ff2ea6" stroke-opacity=".45"/>
      <text x="126" y="70" text-anchor="middle" fill="#ff73c3" font-size="48" font-weight="800">8+</text>
      <text x="126" y="106" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="2">CLOUD</text>
      <text x="126" y="130" text-anchor="middle" fill="#7fa7c8" font-size="14">Platforms &amp; Infrastructure</text>
    </g>

    <g transform="translate(904 105)">
      <rect width="250" height="150" rx="18" fill="#0b1a2d" stroke="#00d0b4" stroke-opacity=".45"/>
      <text x="125" y="70" text-anchor="middle" fill="#3ce6ca" font-size="48" font-weight="800">2+</text>
      <text x="125" y="106" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="2">EMBEDDED C++</text>
      <text x="125" y="130" text-anchor="middle" fill="#7fa7c8" font-size="14">IoT &amp; Edge Systems</text>
    </g>
  </g>
</svg>
