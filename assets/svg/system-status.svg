<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Adriano Ferreira system status</title>
  <desc id="desc">Futuristic system status card showing role, experience, focus areas and online status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#7c3cff"/>
      <stop offset="1" stop-color="#ff2ea6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9edcff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" fill="none" stroke="#3f5f86" stroke-opacity=".55" stroke-width="3"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <path d="M42 76 H1158" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
  <circle cx="60" cy="46" r="7" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="86" cy="46" r="7" fill="#7c3cff"/>
  <circle cx="112" cy="46" r="7" fill="#ff2ea6"/>

  <text x="150" y="56" fill="#dff7ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">SYSTEM STATUS</text>

  <g transform="translate(50 105)">
    <rect width="360" height="250" rx="20" fill="#0b1a2d" stroke="#1f4769"/>
    <text x="28" y="46" fill="#7fa7c8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">IDENTITY</text>
    <text x="28" y="84" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Adriano Ferreira</text>

    <text x="28" y="132" fill="#7fa7c8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">ROLE</text>
    <text x="28" y="164" fill="#d7e7f7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">Hands-on Engineering Manager</text>

    <text x="28" y="212" fill="#7fa7c8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">EXPERIENCE</text>
    <text x="28" y="242" fill="#00e5ff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" filter="url(#glow)">23+ YEARS</text>
  </g>

  <g transform="translate(440 105)">
    <rect width="460" height="250" rx="20" fill="#0b1a2d" stroke="#1f4769"/>
    <text x="28" y="46" fill="#7fa7c8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">ACTIVE MODULES</text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
      <rect x="28" y="74" width="178" height="42" rx="12" fill="#0d2940" stroke="#00e5ff" stroke-opacity=".55"/>
      <text x="117" y="101" text-anchor="middle" fill="#dffaff">CLOUD</text>

      <rect x="222" y="74" width="208" height="42" rx="12" fill="#151f3a" stroke="#7c3cff" stroke-opacity=".65"/>
      <text x="326" y="101" text-anchor="middle" fill="#eee7ff">PLATFORM</text>

      <rect x="28" y="132" width="178" height="42" rx="12" fill="#241631" stroke="#ff2ea6" stroke-opacity=".55"/>
      <text x="117" y="159" text-anchor="middle" fill="#ffe5f4">AI</text>

      <rect x="222" y="132" width="208" height="42" rx="12" fill="#0e2730" stroke="#00d0b4" stroke-opacity=".55"/>
      <text x="326" y="159" text-anchor="middle" fill="#dcfff8">IoT &amp; EDGE</text>

      <rect x="28" y="190" width="178" height="42" rx="12" fill="#18222d" stroke="#8cb6d8" stroke-opacity=".5"/>
      <text x="117" y="217" text-anchor="middle" fill="#e7f4ff">EMBEDDED</text>

      <rect x="222" y="190" width="208" height="42" rx="12" fill="#18222d" stroke="#8cb6d8" stroke-opacity=".5"/>
      <text x="326" y="217" text-anchor="middle" fill="#e7f4ff">DEVELOPER EXPERIENCE</text>
    </g>
  </g>

  <g transform="translate(930 105)">
    <rect width="220" height="250" rx="20" fill="#0b1a2d" stroke="#1f4769"/>
    <circle cx="110" cy="86" r="42" fill="#0a2228" stroke="#00e5b8" stroke-width="3" filter="url(#glow)"/>
    <circle cx="110" cy="86" r="13" fill="#00e5b8"/>
    <text x="110" y="158" text-anchor="middle" fill="#7fa7c8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">STATUS</text>
    <text x="110" y="194" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">ONLINE</text>
    <text x="110" y="224" text-anchor="middle" fill="#00e5b8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">BUILDING</text>
  </g>
</svg>
