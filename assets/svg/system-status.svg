<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Adriano Ferreira system status</title>
  <desc id="desc">Compact futuristic system status card for Adriano Ferreira.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.52" stop-color="#7c3cff"/>
      <stop offset="1" stop-color="#ff2ea6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9edcff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="24.5" fill="none" stroke="#3f5f86" stroke-opacity=".55" stroke-width="3"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>

  <circle cx="42" cy="38" r="5" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="62" cy="38" r="5" fill="#7c3cff"/>
  <circle cx="82" cy="38" r="5" fill="#ff2ea6"/>

  <text x="110" y="45"
        fill="#dff7ff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="700"
        letter-spacing="4">
    SYSTEM STATUS
  </text>

  <path d="M34 66H1166" stroke="url(#accent)" stroke-width="2" opacity=".85"/>

  <!-- Identity -->
  <g transform="translate(34 90)">
    <rect width="340" height="220" rx="18" fill="#0b1a2d" stroke="#1f4769"/>

    <text x="24" y="34"
          fill="#6f99ba"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="2.5">
      IDENTITY
    </text>

    <text x="24" y="67"
          fill="#ffffff"
          font-family="Arial, Helvetica, sans-serif"
          font-size="23"
          font-weight="700">
      Adriano Ferreira
    </text>

    <text x="24" y="105"
          fill="#6f99ba"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="2.5">
      ROLE
    </text>

    <text x="24" y="134"
          fill="#d7e7f7"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          font-weight="600">
      Hands-on Engineering Manager
    </text>

    <text x="24" y="174"
          fill="#6f99ba"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="2.5">
      EXPERIENCE
    </text>

    <text x="24" y="204"
          fill="#00e5ff"
          font-family="Arial, Helvetica, sans-serif"
          font-size="20"
          font-weight="800"
          filter="url(#glow)">
      23+ YEARS
    </text>
  </g>

  <!-- Active modules -->
  <g transform="translate(396 90)">
    <rect width="506" height="220" rx="18" fill="#0b1a2d" stroke="#1f4769"/>

    <text x="24" y="34"
          fill="#6f99ba"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="2.5">
      ACTIVE MODULES
    </text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
      <rect x="24" y="58" width="140" height="38" rx="11" fill="#0d2940" stroke="#00e5ff" stroke-opacity=".55"/>
      <text x="94" y="82" text-anchor="middle" fill="#dffaff">CLOUD</text>

      <rect x="181" y="58" width="140" height="38" rx="11" fill="#151f3a" stroke="#7c3cff" stroke-opacity=".65"/>
      <text x="251" y="82" text-anchor="middle" fill="#eee7ff">PLATFORM</text>

      <rect x="338" y="58" width="144" height="38" rx="11" fill="#241631" stroke="#ff2ea6" stroke-opacity=".55"/>
      <text x="410" y="82" text-anchor="middle" fill="#ffe5f4">AI</text>

      <rect x="24" y="112" width="140" height="38" rx="11" fill="#0e2730" stroke="#00d0b4" stroke-opacity=".55"/>
      <text x="94" y="136" text-anchor="middle" fill="#dcfff8">IoT &amp; EDGE</text>

      <rect x="181" y="112" width="140" height="38" rx="11" fill="#18222d" stroke="#8cb6d8" stroke-opacity=".5"/>
      <text x="251" y="136" text-anchor="middle" fill="#e7f4ff">EMBEDDED</text>

      <rect x="338" y="112" width="144" height="38" rx="11" fill="#18222d" stroke="#8cb6d8" stroke-opacity=".5"/>
      <text x="410" y="136" text-anchor="middle" fill="#e7f4ff">DEVEX</text>
    </g>

    <text x="24" y="184"
          fill="#6f99ba"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="2.5">
      PRIMARY OBJECTIVE
    </text>

    <text x="24" y="208"
          fill="#d7e7f7"
          font-family="Arial, Helvetica, sans-serif"
          font-size="14"
          font-weight="600">
      Build intelligent platforms connecting cloud, software and the physical world.
    </text>
  </g>

  <!-- Status -->
  <g transform="translate(924 90)">
    <rect width="242" height="220" rx="18" fill="#0b1a2d" stroke="#1f4769"/>

    <circle cx="121" cy="73" r="34" fill="#0a2228" stroke="#00e5b8" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="121" cy="73" r="10" fill="#00e5b8"/>

    <text x="121" y="132"
          text-anchor="middle"
          fill="#6f99ba"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="2.5">
      STATUS
    </text>

    <text x="121" y="164"
          text-anchor="middle"
          fill="#ffffff"
          font-family="Arial, Helvetica, sans-serif"
          font-size="22"
          font-weight="800">
      ONLINE
    </text>

    <text x="121" y="194"
          text-anchor="middle"
          fill="#00e5b8"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="2">
      BUILDING
    </text>
  </g>
</svg>
